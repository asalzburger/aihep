[project]
name = "tracker"
version = "0.1.0"
description = "1D adjacent-cell clustering of tracker hits digitized onto detector2d layers"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "pyarrow"]
# detector2d and clustering_utils are sibling path packages (not on PyPI);
# install them explicitly, see README.md.

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tracker"]
