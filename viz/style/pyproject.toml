[project]
name = "viz-style"
version = "0.1.0"
description = "Centralized matplotlib theming (print/present) and color palette, shared across the repo's plotting packages"
requires-python = ">=3.10"
dependencies = ["matplotlib"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["viz_style"]
