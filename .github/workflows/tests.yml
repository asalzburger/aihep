name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # headless matplotlib backend (tracksim2d/hopfield_tracking/denby all plot)
  MPLBACKEND: Agg

jobs:
  pytest:
    name: pytest (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each package below is independently installable (its own
          # requirements.txt, most with a pyproject.toml) and has its own
          # tests/ directory -- mirroring how they're developed locally,
          # one venv per package. Sibling path dependencies (e.g. tracksim2d
          # needing detector2d) are installed editable, matching each
          # package's own README "Setup" section.
          - name: detector2d
            path: detector/detector2d
            install: pip install -e . -r requirements.txt
            test: pytest tests/ -q

          - name: tracksim2d
            path: simulator/tracksim2d
            install: pip install -e ../../detector/detector2d -e . -r requirements.txt
            test: pytest tests/ -q

          - name: clustering-utils
            path: clustering/utils
            install: pip install -e . -r requirements.txt
            test: pytest tests/ -q

          - name: sensor
            path: clustering/sensor
            install: pip install -e ../utils -r requirements.txt
            test: python -m pytest tests/ -q

          - name: tracker
            path: clustering/tracker
            install: pip install -e ../../detector/detector2d -e ../utils -e . -r requirements.txt
            test: pytest tests/ -q

          - name: soho
            path: clustering/soho
            apt: libcairo2 libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf2.0-0
            install: pip install -r requirements.txt
            test: python -m pytest tests/ -q

          - name: hopfield_tracking
            path: tracking/hopfield_tracking
            install: pip install -e . -r requirements.txt
            test: pytest tests/ -q

          - name: denby
            path: tracking/denby
            install: pip install -e ../../detector/detector2d -e ../../simulator/tracksim2d -e ../hopfield_tracking -r requirements.txt
            test: python -m pytest tests/ -q

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        if: matrix.apt
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt }}

      - name: Install Python dependencies
        working-directory: ${{ matrix.path }}
        run: |
          python -m pip install --upgrade pip
          ${{ matrix.install }}

      - name: Run tests
        working-directory: ${{ matrix.path }}
        run: ${{ matrix.test }}
